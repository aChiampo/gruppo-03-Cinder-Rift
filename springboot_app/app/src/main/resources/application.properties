spring.application.name=app
server.port=8081

# Schema v1.1 is provisioned outside the application. Keep startup from writing schema changes.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.mvc.problemdetails.enabled=true

# Spring cron includes seconds. Use '-' to disable session cleanup on an instance.
app.security.session-token-cleanup-cron=0 0 3 * * *
app.security.session-token-cleanup-zone=UTC
