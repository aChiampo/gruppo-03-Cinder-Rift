spring.application.name=app
server.port=8081

# Existing schemas require an explicit Flyway baseline after schema comparison.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.mvc.problemdetails.enabled=true

# Spring cron includes seconds. Use '-' to disable session cleanup on an instance.
app.security.session-token-cleanup-cron=0 0 3 * * *
app.security.session-token-cleanup-zone=UTC

# Recovery token validation is independent of this cleanup schedule.
app.security.password-reset-token-cleanup-cron=0 0 3 * * *
app.security.password-reset-token-cleanup-zone=UTC
